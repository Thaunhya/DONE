<style>
html, body {
  height: 100%;
  margin: 0;
  display: flex;
  flex-direction: column;
  font-family: 'Segoe UI', sans-serif;
}

/* Main login section takes all available space */
.login-section {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 60px;
  background-color: #f2f6fc;
}

/* Login box styling */
.login-box {
  background: white;
  padding: 30px 40px;
  border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  width: 320px;
  margin-right: 60px;
}

.login-box h2 {
  margin-bottom: 20px;
  text-align: center;
}

.login-box input {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.actions {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 15px;
}

.actions a {
  color: #0055ff;
  text-decoration: none;
  font-size: 0.9rem;
}

.login-box button {
  width: 100%;
  background-color: #0055ff;
  color: white;
  border: none;
  padding: 12px;
  font-size: 1rem;
  border-radius: 8px;
  cursor: pointer;
}

.login-box p {
  text-align: center;
  margin-top: 15px;
  font-size: 0.9rem;
}

.login-box p a {
  color: #0055ff;
  text-decoration: none;
}

/* Right-side image */
.login-image img {
  width: 350px;
  max-width: 100%;
}

/* Footer at bottom */
.footer {
  background: #0055ff;
  color: white;
  text-align: center;
  padding: 20px;
  font-size: 0.9rem;
  margin-top: auto;
}

.footer-links {
  margin-top: 10px;
}

.footer-links a {
  color: white;
  margin: 0 10px;
  text-decoration: none;
}
</Style>

<!-- Login Section -->
  <section class="login-section">
    <div class="login-box">
      <h2>Sign in</h2>
      <form onsubmit="handleLogin(event)">
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <div class="actions">
          <a href="#">Forgot Password</a>
        </div>
        <button type="submit">Login</button>
        <p>Do not have an account yet? <a href="#">Sign Up</a></p>
      </form>
    </div>
    <div class="login-image">
      <img src="login_image.png" alt="Cloud illustration" />
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>Copyright © 2025 Delaplex, Inc. – All rights reserved.</p>
    <div class="footer-links">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Usage & Service</a>
      <a href="#">Refund & Cancellation Policy</a>
    </div>
  </footer>
